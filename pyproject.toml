[project]
name = "hexamsh"
description = "Generate structured hexahedral meshes for finite element analysis from CAD models using Gmsh."
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["hexahedral-mesh", "mesh-generation", "gmsh", "finite-element-analysis"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dynamic = ["version"]
dependencies = ["gmsh", "numpy", "click", "scipy", "keyboard", "pynput"]

[project.urls]
Homepage = "https://github.com/michelin/HexaMSH"
Repository = "https://github.com/michelin/HexaMSH"
Issues = "https://github.com/michelin/HexaMSH/issues"

[build-system]
requires = ["setuptools>=77", "wheel"]

[project.optional-dependencies]
dev = [
    "bandit",
    "black",
    "isort",
    "pylint",
    "pytest",
    "pytest-cov",
    "pytest-html",
    "sphinx",
    "sphinx-copybutton",
]
[tool.setuptools.packages.find]

[project.scripts]
hexamsh = "hexamsh:main"

# DEV TOOLS
## pylint
[tool.pylint.reports]
output-format = "colorized"

[tool.pylint.format]
max-line-length = 88

[tool.pylint."messages control"]
disable = [
    "logging-fstring-interpolation", # https://github.com/PyCQA/pylint/issues/2395
    "too-few-public-methods",
    "too-many-ancestors",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-public-methods",
]

## isort
[tool.isort]
profile = "black"
balanced_wrapping = true
line_length = 88
multi_line_output = 3
use_parentheses = true
include_trailing_comma = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip_glob = ["venv", ".venv"]

## pytest
[tool.pytest.ini_options]
addopts = "--cov-branch"

## coverage
[tool.coverage.run]
branch = true
omit = [
    "setup.py",
    "docs/**",
    "public/**",
    "hexamsh/tests/**",
    "hexamsh/version.py",
]

## security
[tool.bandit]
exclude_dirs = ["tests/", "__pycache__/", "venv/", ".venv/"]
